<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D4F7E0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-180.png" />
    <title>Субсидии · рабочее место специалиста</title>
    <!-- Настройки стенда без пересборки: адрес API (docs/DEPLOY.md) -->
    <script src="/config.js"></script>
    <script>
      // Тема до первой отрисовки — без вспышки светлого фона
      (function () {
        try {
          var m = localStorage.getItem("subsidy.theme") || "system";
          var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
      <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#E2F5E9;transition:opacity .35s ease,visibility .35s}
      .dark #splash{background:#121417}
      #splash img{width:56px;height:56px;border-radius:16px;animation:sp 1.2s ease-in-out infinite}
      #splash.out{opacity:0;visibility:hidden}
      @keyframes sp{50%{transform:scale(.92);opacity:.7}}
      @media (prefers-reduced-motion:reduce){#splash img{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/favicon.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
