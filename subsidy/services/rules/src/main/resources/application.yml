spring:
  application:
    name: rules
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/rules
    username: rules
    password: ${RULES_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: rules
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: rules

server:
  port: 8083
  shutdown: graceful

management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

app:
  staff-token:
    issuer: ${STAFF_TOKEN_ISSUER:https://localhost/package}
    jwks-uri: ${STAFF_JWKS_URI:http://localhost:8081/internal/staff/jwks}
  outbox:
    shared: true
    relay: true
  rules:
    debounce: ${RECHECK_DEBOUNCE:1s}
    recheck-poll: ${RECHECK_POLL:500ms}
    zone: ${APP_ZONE:Europe/Moscow}
    expiring-days: ${EXPIRING_DAYS:30}
    docproc-url: ${DOCPROC_URL:http://docproc:8082}
  service-account:
    client-id: svc-rules
    client-secret: ${KC_SVC_RULES_SECRET}
    token-uri: ${OIDC_TOKEN_URI:http://keycloak:8080/auth/realms/subsidy/protocol/openid-connect/token}
