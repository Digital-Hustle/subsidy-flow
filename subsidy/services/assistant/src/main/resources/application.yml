spring:
  application:
    name: assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/assistant
    username: assistant
    password: ${ASSISTANT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: assistant
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: assistant

app:
  staff-token:
    issuer: ${STAFF_TOKEN_ISSUER:https://localhost/package}
    jwks-uri: ${STAFF_JWKS_URI:http://localhost:8081/internal/staff/jwks}
  service-account:
    client-id: svc-assistant
    client-secret: ${KC_SVC_ASSISTANT_SECRET}
    token-uri: ${OIDC_TOKEN_URI:http://keycloak:8080/auth/realms/subsidy/protocol/openid-connect/token}
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    rules-url: ${RULES_URL:http://rules:8083}
    max-tool-calls: 4
    max-question-length: 1000
    history-limit: 50
  llm:
    provider: ${LLM_PROVIDER:ollama}
    base-url: ${LLM_BASE_URL:http://ollama:11434}
    model: ${LLM_MODEL:qwen3:8b}
    vision-model: ${LLM_VISION_MODEL:qwen2.5vl:7b}
    api-key: ${LLM_API_KEY}
    json-mode: ${LLM_JSON_MODE:json_schema}
    timeout: ${LLM_TIMEOUT_SECONDS:120}s
    max-concurrency: ${LLM_MAX_CONCURRENCY:2}
    gigachat-auth-key: ${GIGACHAT_AUTH_KEY:}
    gigachat-scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

server:
  port: 8084
  shutdown: graceful

management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
