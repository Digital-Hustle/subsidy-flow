[project]
name = "ocr"
version = "0.1.0"
description = "Субсидии: извлечение текста, слов с координатами и метрик качества"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pytesseract>=0.3.13",
    "pyjwt[crypto]>=2.9",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["ruff>=0.7", "mypy>=1.13", "pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pdfplumber.*", "pypdfium2.*", "pillow_heif.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
