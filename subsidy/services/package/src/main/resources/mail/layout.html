<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#F2F5F3;font:16px/1.5 'SB Sans Text',Arial,sans-serif;color:#172419">
<div style="display:none;max-height:0;overflow:hidden">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F5F3">
<tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
<tr><td style="padding:0 8px 16px">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td style="width:36px;height:36px;border-radius:10px;background:#107F3B;background-image:linear-gradient(135deg,#21A038 0%,#0C6B34 100%);color:#fff;font:700 18px/36px Arial,sans-serif;text-align:center">С</td>
<td style="padding-left:10px;font:600 18px/1.2 'SB Sans Display',Arial,sans-serif;color:#172419">Субсидии<br><span style="font:400 12px/1.2 Arial,sans-serif;color:#5C6B60">проверка пакетов документов</span></td>
</tr></table>
</td></tr>
<tr><td style="border-radius:24px;background:#FFFFFF;padding:32px 28px;box-shadow:0 1px 2px rgba(23,36,25,.06),0 8px 24px rgba(23,36,25,.06)">
<h1 style="margin:0 0 8px;font:600 26px/1.15 'SB Sans Display',Arial,sans-serif;letter-spacing:-.4px;color:#172419">{{title}}</h1>
<p style="margin:0;color:#3A4A3E">{{lead}}</p>
{{body}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px"><tr><td style="border-radius:12px;background:#107F3B">
<a href="{{url}}" style="display:inline-block;padding:14px 24px;font:600 15px/1 Arial,sans-serif;color:#FFFFFF;text-decoration:none">{{action}}</a>
</td></tr></table>
</td></tr>
<tr><td style="padding:16px 12px 0;font-size:12px;line-height:1.5;color:#7A877D">{{note}}<br>Письмо отправлено автоматически, отвечать на него не нужно.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
