name: subsidy-deploy
on:
  workflow_run:
    workflows: [subsidy-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref: { description: 'git ref / тег (например subs-demo-2)', required: true, default: main }
permissions:
  contents: read
  packages: write
concurrency: { group: subsidy-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: vars.SUBS_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: postgres
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      REG: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.REF }}' }
      - id: v
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: jar-ы (jOOQ генерируется из БД, поэтому вне docker build)
        working-directory: subsidy/services
        run: |
          for d in */src/main/resources/db/changelog; do svc=${d%%/*}
            PGPASSWORD=postgres psql -h localhost -U postgres -c "create database $svc"
            ./gradlew --no-daemon -q :$svc:update :$svc:generateJooq; done
          ./gradlew --no-daemon -q bootJar
      - name: build & push images (Java-сервисы, ocr, frontend)
        run: |
          TAG=${{ steps.v.outputs.tag }}
          cd subsidy/services
          for svc in $(for d in */; do [ -f "$d/build.gradle.kts" ] && [ -d "$d/src" ] && basename "$d"; done | grep -vE '^(libs|build-logic)$'); do
            docker build -t $REG/subs-$svc:$TAG --build-arg SERVICE=$svc -f Dockerfile .
            docker push $REG/subs-$svc:$TAG
          done
          for svc in $(for d in */; do [ -f "$d/pyproject.toml" ] && basename "$d"; done); do
            docker build -t $REG/subs-$svc:$TAG $svc && docker push $REG/subs-$svc:$TAG
          done
          cd ../frontend && docker build -t $REG/subs-frontend:$TAG . && docker push $REG/subs-frontend:$TAG
      - name: deploy over ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "
            set -e; cd /opt/subsidy-flow/subsidy/infra
            PREV=\$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env
            docker compose pull && docker compose up -d --remove-orphans
            for i in \$(seq 1 30); do curl -fsk https://localhost/api/gateway/health && exit 0; sleep 4; done
            echo 'health failed, rollback to' \$PREV; sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\$PREV/\" .env
            docker compose up -d; exit 1"
          rm -f key
