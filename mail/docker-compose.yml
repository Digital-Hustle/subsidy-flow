# Общий почтовый узел сервера (один на все кейсы): принимает письма от контейнеров без пароля
# и отдаёт их в smtp.beget.com от no-reply@digital-hustle.ru. Запуск: cd mail && cp .env.example .env (пароль ящика) && docker compose up -d
name: mail
services:
  postfix:
    image: boky/postfix:v4.4.0
    restart: unless-stopped
    # только на docker-мосту: снаружи сервера порт недоступен (не открытый релей)
    ports: ["172.17.0.1:2525:587"]
    environment:
      RELAYHOST: "[smtp.beget.com]:465"
      RELAYHOST_USERNAME: ${RELAYHOST_USERNAME:-no-reply@digital-hustle.ru}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD}
      ALLOWED_SENDER_DOMAINS: digital-hustle.ru
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-mail.digital-hustle.ru}
      POSTFIX_mynetworks: "127.0.0.0/8 172.16.0.0/12"
      POSTFIX_smtp_tls_wrappermode: "yes"
      POSTFIX_smtp_tls_security_level: encrypt
      # beget принимает письма только от авторизованного ящика — любой отправитель переписываем на него
      POSTFIX_sender_canonical_maps: "regexp:/etc/postfix/sender_canonical"
      POSTFIX_sender_canonical_classes: "envelope_sender"
    volumes:
      - ./sender_canonical:/etc/postfix/sender_canonical:ro
      - spool:/var/spool/postfix
volumes:
  spool:
