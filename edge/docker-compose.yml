# Общий edge-прокси сервера (один на все кейсы). Запуск: cd edge && cp .env.example .env (вписать хосты) && docker compose up -d
name: edge
services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOCUMENTS_HOST: ${DOCUMENTS_HOST:-documents.localhost}
      SUBSIDY_HOST: ${SUBSIDY_HOST:-subsidy.localhost}
      PROXODNAYA_HOST: ${PROXODNAYA_HOST:-proxodnaya.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edgedata:/data
volumes:
  edgedata:
